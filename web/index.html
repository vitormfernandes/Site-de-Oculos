<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provador de Óculos Virtual</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="main-container">
        <div id="viewer-container">
            
            <div id="glass-container">
                <div id="preview-3d"></div>
            </div>

            <video id="webcam" style="display: none;"></video>
            <canvas id="debug-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
        </div>
        
        <div style="margin: 10px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
            <button id="reviewBtn">Modelos de revisão (<span id="reviewCount">0</span>)</button>
            <label for="modelSelect">Modelo:</label>
            <select id="modelSelect"></select>
        </div>

        <button id="tryOnBtn">Testar no Rosto</button>
        <p>Preview ativo — clique para provar os óculos no rosto</p>
    </div>

    <script src="script.js"></script>
    <script src="OculosAnalyzer.js"></script>
</body>
</html>
